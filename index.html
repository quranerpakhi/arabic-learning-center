<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আরবী ভাষা শিক্ষা ক্লাস নোট</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- হেডার সেকশন -->
    <header>
        <div class="logo">
    <img src="images/logo.png" alt="আরবী শিক্ষা লোগো" style="height: 100px; width: auto; vertical-align: middle;">
</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#notes">Class Notes</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- হিরো সেকশন (৪টি অ্যাকশন অপশন) -->
    <section id="home" class="hero">
        <h1>আরবী ভাষা শিক্ষার আঙিনায় স্বাগতম</h1>
        <div class="main-options">
            <a href="#notes" onclick="filterNotes('regular')" class="opt-btn">রেগুলার ক্লাস নোট</a>
            <a href="#notes" onclick="filterNotes('extra')" class="opt-btn">এক্সট্রা ক্লাস নোট</a>
            <a href="#" id="whatsapp-btn" target="_blank" class="opt-btn wa">WhatsApp Link</a>
            <a href="#" id="meet-btn" target="_blank" class="opt-btn meet">Live Call Link (Google Meet)</a>
        </div>
    </section>

    <!-- সার্ভিস/নোট সেকশন -->
    <section id="notes" class="notes-section">
        <h2 id="section-title">রেগুলার ক্লাস নোটসমূহ</h2>
        <div class="notes-grid" id="notes-container">
            <!-- জাভাস্ক্রিপ্ট এর মাধ্যমে এখানে বক্সগুলো অটো তৈরি হবে -->
        </div>
    </section>

    <!-- ফুটার সেকশন -->
    <footer>
        <p>&copy; 2026 আরবী ভাষা শিক্ষা। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
